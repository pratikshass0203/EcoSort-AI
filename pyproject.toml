[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosort-ai"
version = "0.1.0"
description = "EcoSort AI: Smart Recycling and Waste-Segregation Assistant (Bharat AI-SoC Challenge 2026-2027)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "EcoSort AI Team" }
]
dependencies = [
    "torch==2.6.0+cpu",
    "torchvision==0.21.0+cpu",
    "numpy==2.1.3",
    "Pillow==11.1.0",
    "opencv-python-headless==4.11.0.86",
    "streamlit==1.42.0",
    "pyyaml==6.0.2",
    "scikit-learn==1.6.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
